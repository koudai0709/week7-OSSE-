<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POSSE課題</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-6 rounded-xl shadow-lg">
        <h1 class="text-3xl font-bold text-center mb-6">TO DOリスト</h1>
        <input type="text" id="todoInput" placeholder="タスクを入力..." class="border border-gray-300 rounded mb-4">
        <button id="addBtn" class="bg-green-500 text-white py-2 px-4 rounded hover:bg-green-600 transition">タスクを追加</button>
        <ul id="todoList" class="mt-4"></ul>
    </div>
    <script>
        const addButton = document.querySelector('#addBtn');
        const todoInput = document.querySelector('#todoInput');
        const todoList = document.querySelector('#todoList');

        addButton.addEventListener('click', () => {
            const text = todoInput.value.;

            if (text === ''){
                return;
            }

            const item = document.createElement('li');
            item.className = 'flex items-center bg-gray-200 p-2 rounded mb-2';
            
            const span = document.createElement('span');
            span.textContent = text;
        
            const doneBtn = document.createElement('button');
            doneBtn.textContent = '完了';
            doneBtn.className = "text-sm text-gray-500 hover:text-red-500";
            
            doneBtn.addEventListener('click', () => {
                span.classList.toggle('line-through');
                span.classList.toggle('text-gray-400');
            });

            item.appendChild(span);
            item.appendChild(doneBtn);
            todoList.appendChild(item);

            todoInput.value = '';
        });
    </script>
</body>
</html>
